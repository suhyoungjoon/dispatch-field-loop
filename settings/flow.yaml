# 통합 흐름 상한·판정 기준. 세상 설정이 아니라 우리가 정한 평가 기준이다.
outcome:
  promise_window_min: 60        # 약속 준수: 원래 희망 날짜에, 희망 시각 ±이 값 안에 완료
  seeds: [1, 2, 3, 4, 5]        # 비교표에서 평균을 내는 실적 seed (전후 비교는 같은 seed = 공통 난수)
  min_profiles_agree: 2         # 결론이 몇 개 프로필에서 같아야 "추천"으로 표시하는지 (원칙 6)
  tie_margin_pp: 1.0            # 한 프로필 안에서 1·2위 차이가 이 값(%p) 미만이면 동률로 보고 최고안을 정하지 않는다
